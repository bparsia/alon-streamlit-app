# Reasoner configuration
# This file specifies paths to OWL reasoners

[reasoners.konclude]
# Default: place the Konclude binary at bin/Konclude (gitignored).
# See bin/README.md for download instructions.
# For Streamlit Cloud: Konclude installed via packages.txt
# For Linux system install: path = "/usr/bin/Konclude"
path = "bin/Konclude"
